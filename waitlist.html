<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join the waitlist · MoldAid</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="description" content="Join the MoldAid private beta waitlist. Early access before public release in January 2027.">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0B0F18">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F1EA}
a{color:#355F84}a:hover{color:#0D1116}
input:focus,select:focus,textarea:focus{outline:2px solid #3578C9;outline-offset:1px}
</style>
</head>
<body>
<div style="background-color: #F4F1EA; background-image: linear-gradient(rgba(13, 17, 22, 0.032) 1px, transparent 1px), linear-gradient(90deg, rgba(13, 17, 22, 0.032) 1px, transparent 1px); background-size: 24px 24px; color: #0D1116; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 17px; line-height: 1.55; min-height: 1088px; box-sizing: border-box; padding: 24px clamp(20px, 5vw, 80px) 80px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #0D1116; padding-bottom: 18px">
<a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0D1116">
<img src="assets/brand/moldaid-logo-horizontal-light-bg.svg" alt="MoldAid" style="display: block; height: 32px; width: auto; background: #F4F1EA">
</a>
<a href="index.html" style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; padding: 12px 0">Back to overview</a>
</header>

<main style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 64px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 26px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; color: #5A6270; margin-bottom: -10px">PRIVATE BETA</div>
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: clamp(56px, 7.4vw, 104px); line-height: 0.9">Join the MoldAid <span style="color: #355F84">waitlist.</span></h1>
<p style="margin: 0; font-size: 20px; color: #2A313C; max-width: 500px">We open access in January 2027. Waitlist members get in first, with a launch discount.</p>
<div style="display: flex; flex-direction: column; border-top: 1px solid #0D1116; max-width: 500px">
<div style="display: flex; gap: 18px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid #0D1116"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #94592A">01</span><span>Early access before public release</span></div>
<div style="display: flex; gap: 18px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid #0D1116"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #94592A">02</span><span>Launch discount on your first molds</span></div>
<div style="display: flex; gap: 18px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid #0D1116"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #94592A">03</span><span>A direct line to the team behind it</span></div>
</div>
<figure style="margin: 0; max-width: 500px; box-sizing: border-box; border: 1px solid #0D1116; border-radius: 8px; padding: 8px; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px"><img src="assets/img/mold-frame.jpg" alt="Translucent blue printed mold next to a molded black frame part" style="display: block; width: 100%; height: 190px; object-fit: cover"><figcaption style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #5A6270">VIEW C · PRINTED MOLD AND MOLDED FRAME</figcaption></figure>
</div>

<form style="background: #FFFFFF; border: 1px solid #0D1116; border-radius: 8px; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; gap: 16px; padding: 12px clamp(20px, 3vw, 36px); border-bottom: 1px solid #0D1116; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #5A6270"><span>WAITLIST FORM</span><span>3 REQUIRED FIELDS</span></div>
<div style="padding: clamp(20px, 3vw, 36px); display: flex; flex-direction: column; gap: 22px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 22px">
<div style="display: flex; flex-direction: column; gap: 8px"><label for="bw-name" style="font-weight: 600; font-size: 15px">Name</label><input id="bw-name" type="text" autocomplete="name" style="height: 50px; box-sizing: border-box; background: #F4F1EA; border: 1px solid #5A6270; border-radius: 8px; color: #0D1116; font: inherit; padding: 0 14px"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="bw-email" style="font-weight: 600; font-size: 15px">Work email</label><input id="bw-email" type="email" autocomplete="email" style="height: 50px; box-sizing: border-box; background: #F4F1EA; border: 1px solid #5A6270; border-radius: 8px; color: #0D1116; font: inherit; padding: 0 14px"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="bw-company" style="font-weight: 600; font-size: 15px">Company</label><input id="bw-company" type="text" autocomplete="organization" style="height: 50px; box-sizing: border-box; background: #F4F1EA; border: 1px solid #5A6270; border-radius: 8px; color: #0D1116; font: inherit; padding: 0 14px"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="bw-role" style="font-weight: 600; font-size: 15px">Role <span style="font-weight: 400; color: #5A6270">(optional)</span></label><input id="bw-role" type="text" autocomplete="organization-title" style="height: 50px; box-sizing: border-box; background: #F4F1EA; border: 1px solid #5A6270; border-radius: 8px; color: #0D1116; font: inherit; padding: 0 14px"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="bw-area" style="font-weight: 600; font-size: 15px">Business area <span style="font-weight: 400; color: #5A6270">(optional)</span></label><select id="bw-area" style="height: 50px; box-sizing: border-box; background: #F4F1EA; border: 1px solid #5A6270; border-radius: 8px; color: #0D1116; font: inherit; padding: 0 12px"><option>Choose one</option><option>[Business area options]</option></select></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="bw-why" style="font-weight: 600; font-size: 15px">Why are you interested in MoldAid? <span style="font-weight: 400; color: #5A6270">(optional)</span></label><textarea id="bw-why" rows="4" style="box-sizing: border-box; background: #F4F1EA; border: 1px solid #5A6270; border-radius: 8px; color: #0D1116; font: inherit; padding: 12px 14px; resize: vertical"></textarea></div>
<div style="display: flex; gap: 12px; align-items: flex-start"><input id="bw-consent" type="checkbox" style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: #355F84; flex-shrink: 0"><label for="bw-consent" style="font-size: 15px; color: #3A424F">I agree that MoldAid may email me about beta access. See the <a href="#privacy">privacy policy</a>.</label></div>
<button type="button" style="align-self: flex-start; background: #355F84; color: #FFFFFF; border: 0; border-radius: 8px; font: inherit; font-weight: 600; padding: 16px 30px; cursor: pointer">Join the waitlist</button>
</div>
</form>
</main>

</div>
</div>
</body>
</html>
